<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 960px; background: transparent; }
  body {
    padding: 28px;
    font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: #202428;
  }
  .card {
    width: 904px;
    min-height: 430px;
    padding: 42px 46px;
    background: #fff;
    border: 1px solid #d8dee4;
    border-radius: 8px;
    box-shadow: 0 14px 38px rgba(31, 35, 40, .14);
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 25px;
    font-weight: 700;
  }
  .mark {
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: 8px;
    background: #24292f;
    color: #fff;
    font-size: 24px;
  }
  .badge {
    padding: 8px 13px;
    border-radius: 999px;
    background: #dafbe1;
    color: #116329;
    font-size: 17px;
    font-weight: 700;
  }
  .repo {
    margin-top: 38px;
    color: #0969da;
    font-size: 23px;
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  h1 {
    margin: 15px 0 26px;
    font-size: 34px;
    line-height: 1.34;
    letter-spacing: 0;
    overflow-wrap: anywhere;
  }
  .meta {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
    border-top: 1px solid #d8dee4;
    padding-top: 25px;
  }
  .label {
    margin-bottom: 7px;
    color: #656d76;
    font-size: 15px;
  }
  .value {
    font-size: 18px;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="top">
      <div class="brand">
        <span class="mark">G</span>
        <span>GitHub 仓库动态</span>
      </div>
      <span class="badge">新提交</span>
    </div>
    <div class="repo">{{REPOSITORY}}</div>
    <h1>{{TITLE}}</h1>
    <div class="meta">
      <div>
        <div class="label">提交者</div>
        <div class="value">{{AUTHOR}}</div>
      </div>
      <div>
        <div class="label">提交编号</div>
        <div class="value">{{SHA}}</div>
      </div>
      <div>
        <div class="label">提交时间</div>
        <div class="value">{{TIMESTAMP}}</div>
      </div>
    </div>
  </main>
</body>
</html>
